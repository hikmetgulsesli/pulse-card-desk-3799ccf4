<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Status Utility - Pulse Card Desk</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#dcd9d9",
                        "surface-bright": "#fcf9f8",
                        "on-secondary-container": "#005266",
                        "surface-container-low": "#f6f3f2",
                        "on-tertiary-fixed-variant": "#832700",
                        "error": "#ba1a1a",
                        "primary": "#004cca",
                        "on-error": "#ffffff",
                        "surface": "#fcf9f8",
                        "tertiary": "#9e3100",
                        "inverse-surface": "#313030",
                        "on-primary-fixed-variant": "#003ea8",
                        "background": "#fcf9f8",
                        "error-container": "#ffdad6",
                        "secondary-container": "#00ccf9",
                        "outline-variant": "#c2c6d9",
                        "on-tertiary-fixed": "#390c00",
                        "on-tertiary": "#ffffff",
                        "surface-tint": "#0053da",
                        "primary-fixed": "#dbe1ff",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-container": "#f0eded",
                        "on-surface-variant": "#424656",
                        "on-secondary-fixed": "#001f28",
                        "secondary-fixed": "#b7eaff",
                        "primary-container": "#0062ff",
                        "on-primary-container": "#f3f3ff",
                        "tertiary-fixed-dim": "#ffb59c",
                        "tertiary-container": "#c84000",
                        "on-error-container": "#93000a",
                        "on-surface": "#1c1b1b",
                        "on-primary-fixed": "#00174b",
                        "secondary-fixed-dim": "#4cd6ff",
                        "surface-container-high": "#eae7e7",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#e5e2e1",
                        "outline": "#737687",
                        "on-tertiary-container": "#fff1ed",
                        "inverse-primary": "#b4c5ff",
                        "tertiary-fixed": "#ffdbcf",
                        "secondary": "#00677f",
                        "surface-container-highest": "#e5e2e1",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-background": "#1c1b1b",
                        "inverse-on-surface": "#f3f0ef",
                        "on-secondary-fixed-variant": "#004e60"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "container-max": "1440px",
                        "margin-desktop": "24px",
                        "unit": "4px",
                        "margin-mobile": "16px",
                        "gutter": "12px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "display-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "data-table": ["JetBrains Mono"],
                        "body-md": ["Inter"],
                        "label-mono": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "display-sm": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "headline-md": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "data-table": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-mono": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.surface-dim');
            color: theme('colors.on-surface');
        }
        .status-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-margin-desktop font-body-md text-body-md">
<!-- Utility Container -->
<div class="w-full max-w-2xl bg-surface border border-outline-variant rounded shadow-sm flex flex-col overflow-hidden">
<!-- Header -->
<header class="flex justify-between items-center px-4 py-3 border-b border-outline-variant bg-surface-container-low">
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">Pulse Card Desk</h1>
<div class="font-label-mono text-label-mono text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">schedule</span>
<span id="current-time">14:32:05 UTC</span>
</div>
</header>
<!-- Main Content -->
<main class="p-4 flex flex-col gap-4">
<!-- Controls Bar -->
<div class="flex justify-between items-center bg-surface-container-lowest border border-outline-variant p-3 rounded">
<div class="flex items-center gap-3">
<button class="bg-primary hover:bg-surface-tint text-on-primary px-4 py-2 rounded flex items-center gap-2 transition-colors focus:outline-none focus:ring-2 focus:ring-primary-fixed focus:ring-offset-1">
<span class="material-symbols-outlined text-[18px]">refresh</span>
<span class="font-label-mono text-label-mono">Refresh Status</span>
</button>
<div class="flex items-center gap-2 border-l border-outline-variant pl-3 ml-1">
<span class="font-label-mono text-label-mono text-on-surface-variant">System Ready</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-9 h-5 bg-surface-variant peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-primary-fixed rounded-sm peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-outline after:border after:rounded-sm after:h-4 after:w-4 after:transition-all peer-checked:bg-primary border border-outline-variant"></div>
</label>
</div>
</div>
<div class="flex items-center gap-2 px-3 py-1 bg-surface-container rounded border border-outline-variant">
<div class="w-2 h-2 rounded-full bg-[#10b981] status-pulse"></div>
<span class="font-label-mono text-label-mono text-on-surface">Local State: Connected</span>
</div>
</div>
<!-- Status Grid -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-3">
<!-- Card 1 -->
<div class="border border-outline-variant bg-surface-container-lowest p-3 rounded flex flex-col gap-2">
<div class="flex justify-between items-start">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider">Database Node</span>
<span class="material-symbols-outlined text-outline text-[16px]">database</span>
</div>
<div class="flex items-end gap-2 mt-1">
<div class="text-on-surface font-data-table text-data-table font-medium">Active</div>
<div class="w-1.5 h-1.5 rounded-full bg-[#10b981] mb-1.5"></div>
</div>
<div class="font-label-mono text-label-mono text-outline mt-auto pt-2 border-t border-surface-variant text-[10px]">
                        Last ping: 2s ago
                    </div>
</div>
<!-- Card 2 -->
<div class="border border-outline-variant bg-surface-container-lowest p-3 rounded flex flex-col gap-2">
<div class="flex justify-between items-start">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider">Queue Worker</span>
<span class="material-symbols-outlined text-outline text-[16px]">sync_alt</span>
</div>
<div class="flex items-end gap-2 mt-1">
<div class="text-on-surface font-data-table text-data-table font-medium">Idle</div>
<div class="w-1.5 h-1.5 rounded-full bg-outline mb-1.5"></div>
</div>
<div class="font-label-mono text-label-mono text-outline mt-auto pt-2 border-t border-surface-variant text-[10px]">
                        Last task: 4m ago
                    </div>
</div>
<!-- Card 3 -->
<div class="border border-outline-variant bg-surface-container-lowest p-3 rounded flex flex-col gap-2">
<div class="flex justify-between items-start">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider">Auth Service</span>
<span class="material-symbols-outlined text-outline text-[16px]">lock</span>
</div>
<div class="flex items-end gap-2 mt-1">
<div class="text-on-surface font-data-table text-data-table font-medium">Success</div>
<div class="w-1.5 h-1.5 rounded-full bg-[#10b981] mb-1.5"></div>
</div>
<div class="font-label-mono text-label-mono text-outline mt-auto pt-2 border-t border-surface-variant text-[10px]">
                        Last refresh: 12s ago
                    </div>
</div>
</div>
</main>
</div>
<script>
        // Simple clock update
        function updateTime() {
            const now = new Date();
            const timeString = now.toISOString().substring(11, 19) + ' UTC';
            document.getElementById('current-time').textContent = timeString;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body></html>
